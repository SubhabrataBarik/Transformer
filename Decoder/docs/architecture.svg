<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="1010" viewBox="0 0 1150 1010" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <style>
      .box  { stroke-width: 1.4; rx: 5; }
      .emb  { fill: #fbe1e6; stroke: #c9707f; }
      .att  { fill: #fde3c3; stroke: #d9944a; }
      .norm { fill: #eef6c6; stroke: #a9bf47; }
      .ff   { fill: #d4ebf8; stroke: #5a9fcf; }
      .lin  { fill: #dedcf7; stroke: #8581d1; }
      .soft { fill: #d3f0dc; stroke: #5fb47a; }
      .sdp  { fill: #e7dcf6; stroke: #9a7ccf; }
      .drop { fill: #eeeeee; stroke: #8f8f8f; }
      .mask { fill: #f9d9e6; stroke: #cc6f99; }
      .cat  { fill: #fbf1c2; stroke: #c9a93c; }
      .wire { stroke: #333; stroke-width: 1.4; fill: none; }
      .t    { font-size: 14px; fill: #111; text-anchor: middle; dominant-baseline: central; }
      .ts   { font-size: 12px; fill: #111; text-anchor: middle; dominant-baseline: central; }
      .file { font-family: Consolas, Menlo, monospace; font-size: 11.5px; fill: #1f5fa8; }
      .note { font-size: 11.5px; fill: #555; }
      .title{ font-size: 15px; font-weight: bold; fill: #111; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1150" height="1010" fill="#ffffff"/>

  <!-- ================= MAIN: decoder-only Transformer ================= -->

  <!-- Output Probabilities -->
  <text class="t" x="290" y="28">Output</text>
  <text class="t" x="290" y="46">Probabilities</text>
  <line class="wire" x1="290" y1="78" x2="290" y2="58" marker-end="url(#arrow)"/>

  <!-- Softmax -->
  <rect class="box soft" x="195" y="78" width="190" height="32"/>
  <text class="t" x="290" y="94">Softmax</text>
  <text class="file" x="430" y="90">model.py · F.softmax</text>
  <text class="note" x="430" y="105">probabilities over 65 characters</text>
  <line class="wire" x1="290" y1="140" x2="290" y2="110" marker-end="url(#arrow)"/>

  <!-- Linear -->
  <rect class="box lin" x="195" y="140" width="190" height="32"/>
  <text class="t" x="290" y="156">Linear</text>
  <text class="file" x="430" y="152">model.py · self.linear</text>
  <text class="note" x="430" y="167">(B,T,384) → (B,T,65) logits</text>
  <line class="wire" x1="290" y1="202" x2="290" y2="172" marker-end="url(#arrow)"/>

  <!-- final LayerNorm -->
  <rect class="box norm" x="195" y="202" width="190" height="30"/>
  <text class="t" x="290" y="217">LayerNorm (final)</text>
  <text class="file" x="430" y="213">model.py · self.ln_f</text>
  <text class="note" x="430" y="228">needed because blocks are pre-norm</text>

  <!-- Nx box -->
  <rect x="170" y="255" width="240" height="465" rx="12" fill="#f3f3f3" stroke="#555" stroke-width="1.4"/>
  <text class="t" x="140" y="488" style="font-size:16px">6×</text>
  <text class="file" x="430" y="268">decoder_block.py · DecoderBlock</text>

  <!-- block output -> final LayerNorm -->
  <line class="wire" x1="290" y1="279" x2="290" y2="232" marker-end="url(#arrow)"/>

  <!-- Add 2 -->
  <circle cx="290" cy="290" r="11" fill="#fff" stroke="#333" stroke-width="1.4"/>
  <text class="t" x="290" y="290" style="font-size:16px">+</text>
  <line class="wire" x1="290" y1="322" x2="290" y2="301" marker-end="url(#arrow)"/>

  <!-- Feed Forward -->
  <rect class="box ff" x="195" y="322" width="190" height="56"/>
  <text class="t" x="290" y="341">Feed</text>
  <text class="t" x="290" y="359">Forward</text>
  <text class="file" x="430" y="340">layers/feed_forward.py</text>
  <text class="note" x="430" y="356">Linear 384→1536 · ReLU</text>
  <text class="note" x="430" y="371">Linear 1536→384 · Dropout</text>
  <line class="wire" x1="290" y1="408" x2="290" y2="378" marker-end="url(#arrow)"/>

  <!-- LayerNorm 2 -->
  <rect class="box norm" x="195" y="408" width="190" height="28"/>
  <text class="t" x="290" y="422">LayerNorm</text>
  <text class="file" x="430" y="410">layers/add_and_norm.py</text>
  <text class="note" x="430" y="426">add_norm2: x = x + FFN(LayerNorm(x))</text>

  <!-- residual 2 -->
  <line class="wire" x1="290" y1="481" x2="290" y2="436" marker-end="url(#arrow)"/>
  <polyline class="wire" points="290,466 182,466 182,290 279,290" marker-end="url(#arrow)"/>
  <circle cx="290" cy="466" r="3" fill="#333"/>

  <!-- Add 1 -->
  <circle cx="290" cy="492" r="11" fill="#fff" stroke="#333" stroke-width="1.4"/>
  <text class="t" x="290" y="492" style="font-size:16px">+</text>
  <line class="wire" x1="290" y1="524" x2="290" y2="503" marker-end="url(#arrow)"/>

  <!-- Masked Multi-Head Attention -->
  <rect class="box att" x="195" y="524" width="190" height="64"/>
  <text class="t" x="290" y="538">Masked</text>
  <text class="t" x="290" y="556">Multi-Head</text>
  <text class="t" x="290" y="574">Attention</text>
  <text class="file" x="430" y="542" style="font-size:10.3px">layers/masked_multi_head_attention.py</text>
  <text class="note" x="430" y="558">6 heads × 64 dims, causal mask</text>
  <text class="note" x="430" y="573">detail →</text>
  <line class="wire" x1="290" y1="618" x2="290" y2="588" marker-end="url(#arrow)"/>

  <!-- LayerNorm 1 -->
  <rect class="box norm" x="195" y="618" width="190" height="28"/>
  <text class="t" x="290" y="632">LayerNorm</text>
  <text class="file" x="430" y="626">layers/add_and_norm.py</text>
  <text class="note" x="430" y="642">add_norm1: x = x + MHA(LayerNorm(x))</text>

  <!-- residual 1 + block input -->
  <line class="wire" x1="290" y1="769" x2="290" y2="646" marker-end="url(#arrow)"/>
  <polyline class="wire" points="290,680 182,680 182,492 279,492" marker-end="url(#arrow)"/>
  <circle cx="290" cy="680" r="3" fill="#333"/>

  <!-- embedding sum + positional encoding -->
  <circle cx="290" cy="780" r="11" fill="#fff" stroke="#333" stroke-width="1.4"/>
  <text class="t" x="290" y="780" style="font-size:16px">+</text>
  <circle cx="346" cy="780" r="15" fill="#fff" stroke="#333" stroke-width="1.4"/>
  <path d="M334,780 q 6,-11 12,0 t 12,0" fill="none" stroke="#333" stroke-width="1.3"/>
  <line class="wire" x1="331" y1="780" x2="301" y2="780" marker-end="url(#arrow)"/>
  <text class="t" x="370" y="772" style="text-anchor:start">Positional Encoding</text>
  <text class="file" x="370" y="792">layers/positional_encoding.py</text>
  <text class="note" x="370" y="807">learned 256×384 table (sinusoidal optional)</text>
  <text class="note" x="273" y="799" style="text-anchor:end">(B,T,384)</text>
  <line class="wire" x1="290" y1="820" x2="290" y2="791" marker-end="url(#arrow)"/>

  <!-- Output Embedding -->
  <rect class="box emb" x="195" y="820" width="190" height="48"/>
  <text class="t" x="290" y="836">Output</text>
  <text class="t" x="290" y="853">Embedding</text>
  <text class="file" x="430" y="840">layers/output_embedding.py</text>
  <text class="note" x="430" y="856">65×384 table: (B,T) → (B,T,384)</text>
  <line class="wire" x1="290" y1="900" x2="290" y2="868" marker-end="url(#arrow)"/>

  <!-- Outputs (shifted right) -->
  <text class="t" x="290" y="913">Outputs</text>
  <text class="t" x="290" y="931">(shifted right)</text>
  <text class="file" x="430" y="913">data.py · get_batch</text>
  <text class="note" x="430" y="929">x = chars[i : i+256], target y = chars[i+1 : i+257]</text>

  <!-- ================= DETAIL A: Masked Multi-Head Attention ================= -->
  <text class="title" x="767" y="245">Masked Multi-Head Attention</text>
  <rect x="650" y="255" width="235" height="487" rx="12" fill="#fbfbfb" stroke="#999" stroke-width="1.2" stroke-dasharray="5,4"/>

  <text class="ts" x="767" y="276">(B, T, 384)</text>
  <line class="wire" x1="767" y1="320" x2="767" y2="288" marker-end="url(#arrow)"/>

  <rect class="box drop" x="700" y="320" width="134" height="30"/>
  <text class="t" x="767" y="335">Dropout</text>
  <line class="wire" x1="767" y1="380" x2="767" y2="350" marker-end="url(#arrow)"/>

  <rect class="box lin" x="700" y="380" width="134" height="30"/>
  <text class="t" x="767" y="395">Linear W<tspan dy="4" font-size="10">O</tspan><tspan dy="-4"> 384→384</tspan></text>
  <line class="wire" x1="767" y1="440" x2="767" y2="410" marker-end="url(#arrow)"/>

  <rect class="box cat" x="700" y="440" width="134" height="30"/>
  <text class="t" x="767" y="455">Concat 6×64</text>
  <line class="wire" x1="767" y1="500" x2="767" y2="470" marker-end="url(#arrow)"/>

  <!-- stacked heads -->
  <rect class="box sdp" x="698" y="492" width="155" height="60" opacity="0.55"/>
  <rect class="box sdp" x="694" y="496" width="155" height="60" opacity="0.8"/>
  <rect class="box sdp" x="690" y="500" width="155" height="60"/>
  <text class="t" x="767" y="521">Scaled Dot-Product</text>
  <text class="t" x="767" y="539">Attention</text>
  <text class="ts" x="866" y="500" style="font-weight:bold">h=6</text>

  <line class="wire" x1="704" y1="616" x2="704" y2="560" marker-end="url(#arrow)"/>
  <line class="wire" x1="767" y1="616" x2="767" y2="560" marker-end="url(#arrow)"/>
  <line class="wire" x1="830" y1="616" x2="830" y2="560" marker-end="url(#arrow)"/>

  <!-- V K Q projections, stacked per head -->
  <g>
    <rect class="box lin" x="688" y="612" width="48" height="40" opacity="0.6"/>
    <rect class="box lin" x="684" y="616" width="48" height="40"/>
    <text class="ts" x="708" y="629">Linear</text>
    <text class="ts" x="708" y="645">W<tspan dy="4" font-size="9">V</tspan></text>
    <rect class="box lin" x="751" y="612" width="48" height="40" opacity="0.6"/>
    <rect class="box lin" x="747" y="616" width="48" height="40"/>
    <text class="ts" x="771" y="629">Linear</text>
    <text class="ts" x="771" y="645">W<tspan dy="4" font-size="9">K</tspan></text>
    <rect class="box lin" x="814" y="612" width="48" height="40" opacity="0.6"/>
    <rect class="box lin" x="810" y="616" width="48" height="40"/>
    <text class="ts" x="834" y="629">Linear</text>
    <text class="ts" x="834" y="645">W<tspan dy="4" font-size="9">Q</tspan></text>
  </g>
  <text class="ts" x="708" y="666">V</text>
  <text class="ts" x="771" y="666">K</text>
  <text class="ts" x="834" y="666">Q</text>
  <polyline class="wire" points="708,690 708,676"/>
  <polyline class="wire" points="771,700 771,676"/>
  <polyline class="wire" points="834,690 834,676"/>
  <polyline class="wire" points="708,690 834,690"/>
  <text class="ts" x="767" y="712">x (B,T,384) from LayerNorm</text>
  <text class="note" x="767" y="732" style="text-anchor:middle">each head: 384→64, no bias</text>

  <text class="file" x="767" y="760" style="text-anchor:middle">layers/masked_multi_head_attention.py</text>

  <!-- ================= DETAIL B: Scaled Dot-Product Attention ================= -->
  <text class="title" x="1020" y="245">Scaled Dot-Product Attention</text>
  <rect x="905" y="255" width="235" height="487" rx="12" fill="#fbfbfb" stroke="#999" stroke-width="1.2" stroke-dasharray="5,4"/>

  <text class="ts" x="1010" y="276">(B, T, 64) per head</text>
  <text class="note" x="1018" y="338" style="font-size:11px">softmax(QKᵀ/√dₖ)·V</text>
  <line class="wire" x1="1010" y1="380" x2="1010" y2="288" marker-end="url(#arrow)"/>

  <rect class="box sdp" x="960" y="380" width="100" height="26"/>
  <text class="ts" x="1010" y="393">MatMul</text>
  <line class="wire" x1="1010" y1="440" x2="1010" y2="406" marker-end="url(#arrow)"/>

  <rect class="box drop" x="960" y="440" width="100" height="26"/>
  <text class="ts" x="1010" y="453">Dropout</text>
  <line class="wire" x1="1010" y1="490" x2="1010" y2="466" marker-end="url(#arrow)"/>

  <rect class="box soft" x="960" y="490" width="100" height="26"/>
  <text class="ts" x="1010" y="503">SoftMax</text>
  <line class="wire" x1="1010" y1="540" x2="1010" y2="516" marker-end="url(#arrow)"/>

  <rect class="box mask" x="960" y="540" width="100" height="26"/>
  <text class="ts" x="1010" y="553">Mask (causal)</text>
  <!-- lower-triangular mask icon -->
  <g stroke="#999" stroke-width="0.6">
    <rect x="918" y="537" width="8" height="8" fill="#cc6f99"/><rect x="926" y="537" width="8" height="8" fill="#fff"/><rect x="934" y="537" width="8" height="8" fill="#fff"/><rect x="942" y="537" width="8" height="8" fill="#fff"/>
    <rect x="918" y="545" width="8" height="8" fill="#cc6f99"/><rect x="926" y="545" width="8" height="8" fill="#cc6f99"/><rect x="934" y="545" width="8" height="8" fill="#fff"/><rect x="942" y="545" width="8" height="8" fill="#fff"/>
    <rect x="918" y="553" width="8" height="8" fill="#cc6f99"/><rect x="926" y="553" width="8" height="8" fill="#cc6f99"/><rect x="934" y="553" width="8" height="8" fill="#cc6f99"/><rect x="942" y="553" width="8" height="8" fill="#fff"/>
    <rect x="918" y="561" width="8" height="8" fill="#cc6f99"/><rect x="926" y="561" width="8" height="8" fill="#cc6f99"/><rect x="934" y="561" width="8" height="8" fill="#cc6f99"/><rect x="942" y="561" width="8" height="8" fill="#cc6f99"/>
  </g>
  <line class="wire" x1="1010" y1="590" x2="1010" y2="566" marker-end="url(#arrow)"/>

  <rect class="box cat" x="960" y="590" width="100" height="26"/>
  <text class="ts" x="1010" y="603">Scale ×1/√64</text>
  <line class="wire" x1="1010" y1="640" x2="1010" y2="616" marker-end="url(#arrow)"/>

  <rect class="box sdp" x="960" y="640" width="100" height="26"/>
  <text class="ts" x="1010" y="653">MatMul QKᵀ</text>

  <line class="wire" x1="985" y1="690" x2="985" y2="666" marker-end="url(#arrow)"/>
  <line class="wire" x1="1035" y1="690" x2="1035" y2="666" marker-end="url(#arrow)"/>
  <polyline class="wire" points="1105,690 1105,393 1060,393" marker-end="url(#arrow)"/>
  <text class="t" x="985" y="704">Q</text>
  <text class="t" x="1035" y="704">K</text>
  <text class="t" x="1105" y="704">V</text>
  <text class="note" x="1045" y="732" style="text-anchor:middle">(B, T, 64) each</text>
  <text class="note" x="955" y="632" style="text-anchor:end">(B,T,T)</text>

  <text class="file" x="1022" y="760" style="text-anchor:middle">layers/attention.py · Head</text>

  <!-- ================= caption ================= -->
  <text x="575" y="968" style="font-size:14px; text-anchor:middle; fill:#111">Figure: Decoder-only Transformer (GPT) as implemented in Decoder/ — d_model = 384, h = 6, d_k = d_v = 64, N = 6, context = 256, vocab = 65, dropout = 0.2, 10.79M parameters</text>
  <text x="575" y="990" style="font-size:12.5px; text-anchor:middle; fill:#555">Differences from Vaswani et al. Figure 1: no encoder and no cross-attention sub-layer; pre-norm (LayerNorm before each sub-layer, then Add) plus a final LayerNorm; learned positional embedding.</text>
</svg>
